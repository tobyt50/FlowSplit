services:
  # -----------------------------------------------------------------------------
  # MONOLITH BACKEND (One Service to Rule Them All)
  # -----------------------------------------------------------------------------
  - type: web
    name: flowsplit-backend
    env: docker
    plan: free
    dockerfilePath: ./packages/services/monolith/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - fromGroup: flowsplit-env
      - key: PORT
        value: 4000
      - key: REDIS_URL
        fromService:
          type: redis
          name: flowsplit-redis
          property: connectionString

  # -----------------------------------------------------------------------------
  # REDIS (Managed by Render)
  # -----------------------------------------------------------------------------
  - type: redis
    name: flowsplit-redis
    region: ohio
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  # -----------------------------------------------------------------------------
  # AI SERVICE (Python - Must be separate)
  # -----------------------------------------------------------------------------
  - type: web
    name: flowsplit-ai
    env: docker
    plan: free
    dockerfilePath: ./packages/services/ai-service/Dockerfile
    dockerContext: .
    envVars:
      - fromGroup: flowsplit-env
      - key: PORT
        value: 3107

# -----------------------------------------------------------------------------
# SHARED ENV
# -----------------------------------------------------------------------------
envVarGroups:
  - name: flowsplit-env
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: USE_MOCK_CARDS
        value: "false"