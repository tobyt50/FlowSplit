services:
  # -----------------------------------------------------------------------------
  # MONOLITH BACKEND (One Service to Rule Them All)
  # -----------------------------------------------------------------------------
  - type: web
    name: flowsplit-backend
    env: docker
    plan: free # or starter if you want it to never sleep
    dockerfilePath: ./packages/services/monolith/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health # Ensure you have a health check in one of the controllers
    envVars:
      - fromGroup: flowsplit-env
      - key: PORT
        value: 4000

  # -----------------------------------------------------------------------------
  # AI SERVICE (Python - Must be separate)
  # -----------------------------------------------------------------------------
  - type: web
    name: flowsplit-ai
    env: docker
    plan: free
    # Keep the path to the Dockerfile relative to the repo root
    dockerfilePath: ./packages/services/ai-service/Dockerfile
    # CHANGE THIS: Set context to the service directory so COPY commands work
    dockerContext: ./packages/services/ai-service
    envVars:
      - fromGroup: flowsplit-env
      - key: PORT
        value: 3107

# -----------------------------------------------------------------------------
# SHARED ENV
# -----------------------------------------------------------------------------
envVarGroups:
  - name: flowsplit-env
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: RABBITMQ_URL
        sync: false # Use CloudAMQP URL here
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false